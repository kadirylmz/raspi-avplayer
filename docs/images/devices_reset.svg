<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1100" height="460" rx="14" fill="#0d1117"/>
  <text x="36" y="42" fill="#e6edf3" font-size="20" font-weight="700">Çoklu Cihaz Yönetimi &amp; 60 Saniye Reset Modları</text>

  <!-- Device 1 -->
  <rect x="36" y="64" width="330" height="180" rx="12" fill="#161b22" stroke="#2a3441"/>
  <text x="56" y="92" fill="#e6edf3" font-size="15" font-weight="700">Salon-1 (Bu Cihaz)</text>
  <rect x="260" y="74" width="88" height="24" rx="12" fill="#1c232d" stroke="#2ecc71"/>
  <text x="272" y="90" fill="#2ecc71" font-size="11" font-weight="700">OYNATIYOR</text>
  <text x="56" y="118" fill="#8b98a8" font-size="12">IP: 192.168.1.190 · Raspberry Pi 4 Model B</text>
  <text x="56" y="138" fill="#8b98a8" font-size="12">Sıcaklık: 54.2 °C · RAM: %24 · Disk: %33</text>
  <text x="56" y="158" fill="#8b98a8" font-size="12">Aktif Video: Demo.mp4</text>
  <text x="56" y="178" fill="#8b98a8" font-size="12">Ses Çıkışı: HDMI AUDIO HDMI 0</text>
  <rect x="56" y="198" width="80" height="28" rx="7" fill="#3b9eff"/>
  <text x="77" y="216" fill="#04111f" font-size="12" font-weight="700">Yönet</text>

  <!-- Device 2 -->
  <rect x="384" y="64" width="330" height="180" rx="12" fill="#161b22" stroke="#2a3441"/>
  <text x="404" y="92" fill="#e6edf3" font-size="15" font-weight="700">Projeksiyon-2</text>
  <rect x="608" y="74" width="88" height="24" rx="12" fill="#1c232d" stroke="#2ecc71"/>
  <text x="620" y="90" fill="#2ecc71" font-size="11" font-weight="700">OYNATIYOR</text>
  <text x="404" y="118" fill="#8b98a8" font-size="12">IP: 192.168.1.191 · Raspberry Pi 5</text>
  <text x="404" y="138" fill="#8b98a8" font-size="12">Sıcaklık: 51.8 °C · RAM: %18 · Disk: %21</text>
  <text x="404" y="158" fill="#8b98a8" font-size="12">Aktif Video: Immersive_4K.mp4</text>
  <text x="404" y="178" fill="#8b98a8" font-size="12">Ses Çıkışı: USB AUDIO – DAC</text>
  <rect x="404" y="198" width="80" height="28" rx="7" fill="#1c232d" stroke="#2a3441"/>
  <text x="425" y="216" fill="#e6edf3" font-size="12">Yönet</text>

  <!-- Device 3 -->
  <rect x="732" y="64" width="332" height="180" rx="12" fill="#161b22" stroke="#2a3441"/>
  <text x="752" y="92" fill="#e6edf3" font-size="15" font-weight="700">Fuaye-Kiosk</text>
  <rect x="956" y="74" width="88" height="24" rx="12" fill="#1c232d" stroke="#2ecc71"/>
  <text x="968" y="90" fill="#2ecc71" font-size="11" font-weight="700">OYNATIYOR</text>
  <text x="752" y="118" fill="#8b98a8" font-size="12">IP: 192.168.1.192 · Raspberry Pi 4 Model B</text>
  <text x="752" y="138" fill="#8b98a8" font-size="12">Sıcaklık: 56.0 °C · RAM: %29 · Disk: %40</text>
  <text x="752" y="158" fill="#8b98a8" font-size="12">Aktif Video: Tanitim_1080p.mp4</text>
  <text x="752" y="178" fill="#8b98a8" font-size="12">Ses Çıkışı: ANALOG AUDIO (3.5 MM JACK)</text>
  <rect x="752" y="198" width="80" height="28" rx="7" fill="#1c232d" stroke="#2a3441"/>
  <text x="773" y="216" fill="#e6edf3" font-size="12">Yönet</text>

  <!-- 60s Reset Card -->
  <rect x="36" y="262" width="1028" height="174" rx="12" fill="#161b22" stroke="#2a3441"/>
  <text x="56" y="288" fill="#8b98a8" font-size="12" font-weight="600" letter-spacing="1">ZAMANLI RESET MEKANİZMASI (30s / 60s / 90s / 120s / ÖZEL — TEK SEFERLİK VEYA PERİYODİK)</text>

  <rect x="56" y="304" width="318" height="74" rx="8" fill="#10253a" stroke="#3b9eff"/>
  <text x="72" y="328" fill="#e6edf3" font-size="13" font-weight="700">A) PLAYER RESTART</text>
  <text x="72" y="348" fill="#8b98a8" font-size="11">Sadece mpv oynatma süreci yeniden başlar.</text>
  <text x="72" y="364" fill="#8b98a8" font-size="11">Cihaz ve servis kesintisiz çalışmaya devam eder.</text>

  <rect x="390" y="304" width="318" height="74" rx="8" fill="#161b22" stroke="#2a3441"/>
  <text x="406" y="328" fill="#e6edf3" font-size="13" font-weight="700">B) PLAYER SERVICE RESTART</text>
  <text x="406" y="348" fill="#8b98a8" font-size="11">avplayer-player systemd servisi yeniden başlar</text>
  <text x="406" y="364" fill="#8b98a8" font-size="11">ve aktif video sıfırdan tekrar başlatılır.</text>

  <rect x="724" y="304" width="320" height="74" rx="8" fill="#161b22" stroke="#ff5c5c"/>
  <text x="740" y="328" fill="#ff5c5c" font-size="13" font-weight="700">C) DEVICE REBOOT</text>
  <text x="740" y="348" fill="#8b98a8" font-size="11">Raspberry Pi işletim sistemi gerçekten yeniden</text>
  <text x="740" y="364" fill="#8b98a8" font-size="11">başlar (systemctl reboot). Açılışta video başlar.</text>

  <text x="56" y="412" fill="#e6edf3" font-size="13">Süre: <tspan fill="#3b9eff" font-weight="700">60 saniye</tspan>   ·   Tekrar: <tspan fill="#3b9eff" font-weight="700">Tek seferlik / Periyodik</tspan>   ·   Ses Çıkışı: <tspan fill="#2ecc71" font-weight="700">HDMI / 3.5mm Analog (Pi 4) / USB DAC</tspan></text>
</svg>
