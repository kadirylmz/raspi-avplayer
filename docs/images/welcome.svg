<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1d324d"/>
      <stop offset="100%" stop-color="#090d14"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c29" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0b1018" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <!-- Full-screen Background -->
  <rect width="1100" height="540" rx="14" fill="url(#bg)"/>
  <circle cx="220" cy="140" r="180" fill="#3b9eff" fill-opacity="0.07"/>
  <circle cx="880" cy="400" r="220" fill="#2ecc71" fill-opacity="0.05"/>

  <!-- Centered Rounded Frosted-Glass Card (Matches Web & Pi HDMI 1:1) -->
  <rect x="260" y="65" width="580" height="410" rx="28" ry="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Corporate Logo Box -->
  <rect x="465" y="102" width="170" height="86" rx="10" fill="#1a2636" stroke="#3b9eff" stroke-opacity="0.4"/>
  <circle cx="515" cy="145" r="20" fill="#3b9eff" fill-opacity="0.25" stroke="#3b9eff" stroke-width="2"/>
  <polygon points="510,136 510,154 525,145" fill="#3b9eff"/>
  <text x="546" y="142" fill="#e6edf3" font-size="13" font-weight="800" letter-spacing="1">KURUMSAL</text>
  <text x="546" y="158" fill="#8b98a8" font-size="11" font-weight="600">LOGO ALANI</text>

  <!-- Company Name & Subtitle -->
  <text x="550" y="232" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="2">AV PLAYER SYSTEM</text>
  <text x="550" y="258" text-anchor="middle" fill="#b8c7d9" font-size="14">Profesyonel Medya &amp; Gösterim Sistemi</text>

  <!-- Live Digital Clock -->
  <text x="550" y="346" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="2">14:42:10</text>

  <!-- Turkish Date -->
  <text x="550" y="392" text-anchor="middle" fill="#9fb2c8" font-size="14">21 Kasım 2026 Cumartesi</text>

  <!-- Countdown hint on boot -->
  <text x="550" y="438" text-anchor="middle" fill="#3b9eff" font-size="13" font-weight="600">Karşılama ekranı · 30 saniye sonra video başlayacaktır</text>
</svg>
